<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · LabelKit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310B981'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<!-- Trang lỗi 404: không có sidebar/topbar -->
<body data-page="notfound">
  <div class="error-page">
    <div class="error-box">
      <div class="error-icon"><i data-lucide="image-off"></i></div>
      <p class="error-code">404</p>
      <h1>Page not found</h1>
      <p class="text-muted">The page you're looking for doesn't exist or isn't part of this prototype yet.</p>
      <div class="error-actions">
        <a href="projects.html" class="btn btn-primary"><i data-lucide="arrow-left"></i>Back to projects</a>
        <a href="index.html" class="btn btn-secondary">Sign in page</a>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/app.js"></script>
</body>
</html>
