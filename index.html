<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · LabelKit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310B981'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<!-- Trang đăng nhập: không có sidebar/topbar -->
<body data-page="login">
  <div class="login-page">
    <div class="card login-card">
      <div class="login-logo">
        <span class="logo-mark"><i data-lucide="scan"></i></span>
      </div>
      <h1>Welcome back</h1>
      <p class="login-sub text-muted">Sign in to continue labeling your datasets</p>

      <!-- Bấm "Sign in" → JS chuyển sang projects.html (không kiểm tra mật khẩu) -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="input" type="email" id="email" value="alex@example.com" placeholder="you@company.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="input" type="password" id="password" value="password123" placeholder="••••••••">
        </div>

        <div class="login-options">
          <label class="checkbox"><input type="checkbox" checked> Remember me</label>
          <a href="404.html" class="link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <div class="divider">or</div>

      <a href="projects.html" class="btn btn-secondary btn-block">
        <i data-lucide="key-round"></i>Continue with SSO
      </a>

      <p class="login-footer">Don't have an account? <a href="404.html" class="link">Request access</a></p>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/app.js"></script>
</body>
</html>
